  <!-- Le marqueur de version : sans lui, un navigateur garde la feuille et les
       modules en cache pendant qu'il relit cette page. Tant que les trois
       tenaient chacun leur rôle, la dérive passait inaperçue ; depuis que la
       coque des onglets vit ici, un cache en retard donne des boutons nus et
       des gestes sans effet. À rehausser dès qu'un changement touche à la fois
       cette page et ce qu'elle charge. -->
  <link rel="stylesheet" href="css/atelier.css?v=20261124t">
  <link rel="stylesheet" href="css/table.css?v=20261124t">
  <link rel="stylesheet" href="css/tableFront.css?v=20261124t">
  <script>
    /* Le thème, posé avant le premier pixel. Il vit dans `S.sombre` comme le
       reste de l'état (js/theme.js), mais est aussi noté dans une clé à lui :
       ouvrir ici la sauvegarde entière — des centaines de kilo-octets de
       cartes — pour une seule valeur coûterait ce qu'on cherche à éviter.
       Sans ces quatre lignes, un atelier réglé en sombre s'ouvrirait en clair
       le temps que les modules se chargent, et clignerait à chaque visite.
       C'est le seul script en ligne de la page : il ne pose aucun écouteur, il
       n'écrit qu'un attribut. */
    try {
      var theme = localStorage.getItem('mtg-atelier-theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';
      document.documentElement.dataset.theme = theme;
    } catch (e) { }
  </script>

           une infobulle qui changent à chaque rendu. L'engrenage, lui, vit dans
           le HTML : rien n'y change jamais, et un rendu de moins le laisse sous
