<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier MTG</title>
  <meta name="description" content="Application d'aide à la construction et à l'optimisation de decks Magic: The Gathering (EDH / Commander, Standard, Limité, Cube)." />
  <meta property="og:title" content="Atelier MTG" />
  <meta property="og:description" content="Application d'aide à la construction et à l'optimisation de decks Magic: The Gathering (EDH / Commander, Standard, Limité, Cube)." />
  <!-- Le marqueur de version : sans lui, un navigateur garde la feuille et les
       modules en cache pendant qu'il relit cette page. Tant que les trois
       tenaient chacun leur rôle, la dérive passait inaperçue ; depuis que la
       coque des onglets vit ici, un cache en retard donne des boutons nus et
       des gestes sans effet. À rehausser dès qu'un changement touche à la fois
       cette page et ce qu'elle charge. -->
  <link rel="stylesheet" href="css/atelier.css?v=20260912a">
</head>
<body>
  <header class="top" id="topHeader">
    <div class="top-in">
      <div class="brand">
        <h1>Atelier MTG</h1>
        <span class="sub">Constructeur &amp; Optimiseur</span>
      </div>
      <div class="top-stats" id="topStats"></div>
      <!-- Le coin haut-droit : ce qui règle la vue, non ce qu'elle montre.
           Le bouton des filtres est peint par renderTop() dans sa lucarne —
           son compte et son infobulle changent à chaque rendu. L'engrenage,
           lui, vit dans le HTML : rien n'y change jamais, et un rendu de
           moins le laisse sous le doigt. -->
      <div class="head-actions">
        <span id="headFiltre"></span>
        <button type="button" class="head-param" id="btnParametres" data-act="parametres"
                title="Paramètres : sauvegarde locale, collection, catalogue" aria-label="Paramètres"></button>
      </div>
    </div>

    <!-- Les cinq onglets, dans l'entête même : la barre est collante avec
         elle, et l'on passe d'un pan de l'atelier à l'autre sans remonter.
         Les propositions se lisaient sous un seul onglet ; elles en ont
         désormais trois — le graphe et ce qu'il branche, EDHREC et ses
         recommandations, le catalogue et tout le reste. -->
    <div class="onglets" id="onglets" role="tablist" aria-label="Pans de l'atelier">
      <button type="button" class="onglet" id="ongletCollection" role="tab"
              data-onglet="collection" aria-selected="true" aria-controls="pageCollection" tabindex="0">
        Collection<span class="onglet-pt" aria-hidden="true"></span>
      </button>
      <button type="button" class="onglet" id="ongletDeck" role="tab"
              data-onglet="deck" aria-selected="false" aria-controls="pageDeck" tabindex="-1">
        Deck<span class="onglet-pt" aria-hidden="true"></span>
      </button>
      <button type="button" class="onglet" id="ongletGraphe" role="tab"
              data-onglet="graphe" aria-selected="false" aria-controls="pageGraphe" tabindex="-1">
        Graphe<span class="onglet-pt" aria-hidden="true"></span>
      </button>
      <button type="button" class="onglet" id="ongletEdhrec" role="tab"
              data-onglet="edhrec" aria-selected="false" aria-controls="pageEdhrec" tabindex="-1">
        EDHREC<span class="onglet-pt" aria-hidden="true"></span>
      </button>
      <button type="button" class="onglet" id="ongletCatalogue" role="tab"
              data-onglet="catalogue" aria-selected="false" aria-controls="pageCatalogue" tabindex="-1">
        Catalogue<span class="onglet-pt" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <!-- Les sept sections se répartissent en cinq onglets. Leurs identifiants
         — secB…secH, bodyB…hintH — ont gardé la lettre d'origine que les
         rendus connaissent ; plus aucune lettre n'est affichée. Les deux
         dernières, secG et secH, sont nées de la division de l'onglet des
         suggestions : elles poursuivent la série sans rien renommer. -->

    <!-- Onglet 1 — ce que la collection pèse, et la collection -->
    <div class="page" id="pageCollection" data-page="collection"
         role="tabpanel" aria-labelledby="ongletCollection" tabindex="0">
      <section class="sec" id="secC">
        <div class="sec-head">
          <h2>Statistiques</h2>
          <span class="hint" id="hintC"></span>
        </div>
        <div class="sec-body" id="bodyC"></div>
      </section>
      <section class="sec" id="secB">
        <div class="sec-head">
          <h2>Collection</h2>
          <span class="hint" id="hintB"></span>
        </div>
        <div class="sec-body" id="bodyB"></div>
      </section>
    </div>

    <!-- Onglet 2 — le deck en construction -->
    <div class="page" id="pageDeck" data-page="deck"
         role="tabpanel" aria-labelledby="ongletDeck" tabindex="0" hidden>
      <section class="sec" id="secE">
        <div class="sec-head">
          <h2>Deck</h2>
          <span class="hint" id="hintE"></span>
        </div>
        <div class="sec-body" id="bodyE"></div>
      </section>
    </div>

    <!-- Onglet 3 — le graphe, et les cartes qui se branchent sur les nœuds
         qu'on y isole : on choisit un effet, on voit aussitôt quoi l'alimenter -->
    <div class="page" id="pageGraphe" data-page="graphe"
         role="tabpanel" aria-labelledby="ongletGraphe" tabindex="0" hidden>
      <section class="sec" id="secD">
        <div class="sec-head">
          <h2>Graphe des capacités</h2>
          <span class="hint" id="hintD"></span>
        </div>
        <div class="sec-body" id="bodyD"></div>
      </section>
      <section class="sec" id="secG">
        <div class="sec-head">
          <h2>Pistes autour des nœuds</h2>
          <span class="hint" id="hintG"></span>
        </div>
        <div class="sec-body" id="bodyG"></div>
      </section>
    </div>

    <!-- Onglet 4 — tout ce qui vient d'EDHREC : les statistiques du
         commandant, celles des commandants secondaires, et les cartes que les
         decks recensés recommandent -->
    <div class="page" id="pageEdhrec" data-page="edhrec"
         role="tabpanel" aria-labelledby="ongletEdhrec" tabindex="0" hidden>
      <section class="sec" id="secH">
        <div class="sec-head">
          <h2>EDHREC</h2>
          <span class="hint" id="hintH"></span>
        </div>
        <div class="sec-body" id="bodyH"></div>
      </section>
    </div>

    <!-- Onglet 5 — les suggestions tirées de tout le catalogue, groupées et
         paginées, et l'état du catalogue qui les nourrit -->
    <div class="page" id="pageCatalogue" data-page="catalogue"
         role="tabpanel" aria-labelledby="ongletCatalogue" tabindex="0" hidden>
      <section class="sec" id="secF">
        <div class="sec-head">
          <h2>Suggestions du catalogue</h2>
          <span class="hint" id="hintF"></span>
        </div>
        <div class="sec-body" id="bodyF"></div>
      </section>
    </div>
  </main>

  <!-- Fenêtre modale commune -->
  <dialog id="dlg">
    <div class="dlg-h" id="dlgTitle"></div>
    <div class="dlg-b" id="dlgBody"></div>
    <div class="dlg-f" id="dlgFoot"></div>
  </dialog>

  <!-- Notification toast et aperçu flottant -->
  <div id="toast"></div>
  <div id="cardPreview"></div>

  <!-- Modules chargés dans l'ordre strict défini par l'architecture -->
  <script src="js/effets.js?v=20260912a"></script>
  <script src="js/cartes.js?v=20260912a"></script>
  <script src="js/etat.js?v=20260912a"></script>
  <script src="js/groupes.js?v=20260912a"></script>
  <script src="js/marche.js?v=20260912a"></script>
  <script src="js/scryfall.js?v=20260912a"></script>
  <script src="js/stockage.js?v=20260912a"></script>
  <script src="js/externes.js?v=20260912a"></script>
  <script src="js/graphe.js?v=20260912a"></script>
  <script src="js/stats.js?v=20260912a"></script>
  <script src="js/suggestions.js?v=20260912a"></script>
  <script src="js/collection.js?v=20260912a"></script>
  <script src="js/deck.js?v=20260912a"></script>
  <script src="js/outils.js?v=20260912a"></script>
  <script src="js/dialogue.js?v=20260912a"></script>
  <script src="js/brouillon.js?v=20260912a"></script>
  <script src="js/couleurs.js?v=20260912a"></script>
  <script src="js/apercu.js?v=20260912a"></script>
  <script src="js/versions.js?v=20260912a"></script>
  <script src="js/tuiles.js?v=20260912a"></script>
  <script src="js/ancre.js?v=20260912a"></script>
  <script src="js/recalcul.js?v=20260912a"></script>
  <script src="js/entete.js?v=20260912a"></script>
  <script src="js/rendu.js?v=20260912a"></script>
  <script src="js/fenFormat.js?v=20260912a"></script>
  <script src="js/fenParametres.js?v=20260912a"></script>
  <script src="js/fenBudget.js?v=20260912a"></script>
  <script src="js/fenFiltres.js?v=20260912a"></script>
  <script src="js/fenListes.js?v=20260912a"></script>
  <script src="js/boiteCatalogue.js?v=20260912a"></script>
  <script src="js/fenExport.js?v=20260912a"></script>
  <script src="js/app.js?v=20260912a"></script>
</body>
</html>
